name: CI Tugas Vue Static

on:
  push:
    branches: ["main"]

jobs:
  test-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v3

      - name: Cek Struktur File
        run: |
          echo "Mengecek ketersediaan file aplikasi..."
          if [ -d "html" ] && [ -d "js" ] && [ -d "css" ]; then
            echo "Folder html, js, dan css ditemukan."
          else
            echo "Error: Struktur folder tidak lengkap!"
            exit 1
          fi

      - name: Status Verifikasi
        run: echo "Aplikasi static (Vue CDN) valid dan siap digunakan."
